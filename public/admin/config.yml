backend:
  name: github
  repo: alzari555/galeria-rondot
  branch: main

media_folder: "public/artworks"
public_folder: "/artworks"

locale: "es"
site_url: "https://alzari555.github.io/galeria-rondot"
display_url: "https://alzari555.github.io/galeria-rondot"

collections:
  - name: "artworks"
    label: "Obras de la Galería"
    label_singular: "Obra"
    folder: "src/data/artworks"
    create: true
    delete: true
    format: "json"
    extension: "json"
    slug: "{{catalogCode}}-{{slug}}"
    summary: "{{catalogCode}} — {{title}} ({{status}})"
    thumbnail: "image"
    editor:
      preview: true
      thumbnail: "image"
    sortable_fields:
      fields: ["catalogCode", "title", "year", "status"]
      default:
        field: "catalogCode"
        order: "ascending"
    view_filters:
      - label: "🟢 Disponibles"
        field: "status"
        pattern: "disponible"
      - label: "🟡 Reservadas"
        field: "status"
        pattern: "reservado"
      - label: "⚫ Colección Privada"
        field: "status"
        pattern: "coleccion_privada"
    view_groups:
      - label: "Por Estado de Venta"
        field: "status"
      - label: "Por Año"
        field: "year"
    fields:
      - label: "Código de Catálogo"
        name: "catalogCode"
        widget: "string"
        default: "RON-125"
        hint: "Código único de inventario de la obra (ej: RON-125)"

      - label: "Título de la Obra"
        name: "title"
        widget: "string"
        hint: "Nombre principal de la pieza"

      - label: "Fotografía de la Obra"
        name: "image"
        widget: "image"
        hint: "Imagen de alta resolución de la obra (se mostrará en la miniatura de la tarjeta)"

      - label: "Disponibilidad Comercial"
        name: "status"
        widget: "select"
        options:
          - { label: "🟢 Disponible para adquisición", value: "disponible" }
          - { label: "🟡 Obra reservada", value: "reservado" }
          - { label: "⚫ En colección privada", value: "coleccion_privada" }
        default: "disponible"

      - label: "Precio / Valor"
        name: "price"
        widget: "string"
        default: "Consultar"
        hint: "Precio en USD/moneda o 'Consultar' (ej: USD 2,400)"

      - label: "Dimensiones"
        name: "dimensions"
        widget: "string"
        default: "120 × 90 cm"
        hint: "Medidas exactas en centímetros (ej: 140 × 110 cm)"

      - label: "Técnica y Soporte"
        name: "technique"
        widget: "string"
        default: "Óleo sobre lienzo"
        hint: "Ej: Óleo y pigmentos minerales sobre lino belga"

      - label: "Artista"
        name: "artist"
        widget: "string"
        default: "Miguel Rondot"

      - label: "Año de Creación"
        name: "year"
        widget: "string"
        default: "2026"

      - label: "Nota Curatorial / Historia de la Obra"
        name: "story"
        widget: "text"
        hint: "Texto descriptivo de la obra que se mostrará en el scroll editorial"

      - label: "Atmósfera / Vibes (Buscador)"
        name: "vibes"
        widget: "list"
        default: ["Calma", "Naturaleza"]
        hint: "Sensaciones o estados de ánimo (Calma, Nocturno, Dorados, etc.)"

      - label: "Tags Invisibles (Buscador)"
        name: "tags"
        widget: "list"
        default: ["oleo", "original"]
        hint: "Palabras clave adicionales que el buscador detectará (paisaje, azul, cielo)"

      - label: "ID Técnico"
        name: "id"
        widget: "string"
        default: "obra-nueva"
        hint: "Identificador interno único (sin espacios ni acentos)"

      - label: "Ancho original (px)"
        name: "width"
        widget: "number"
        value_type: "int"
        required: false
        hint: "Opcional: se detecta automáticamente si se deja vacío"

      - label: "Alto original (px)"
        name: "height"
        widget: "number"
        value_type: "int"
        required: false
        hint: "Opcional: se detecta automáticamente si se deja vacío"
