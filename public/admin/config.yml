backend:
  name: github
  repo: alzari555/galeria-rondot
  branch: main

media_folder: "public/artworks"
public_folder: "./artworks"

locale: "es"

collections:
  - name: "catalogo"
    label: "Catálogo de Obras"
    files:
      - name: "artworks"
        label: "Listado de Obras en 3D"
        file: "src/data/artworks.json"
        format: "json"
        fields:
          - label: "Obras"
            name: "items"
            widget: "list"
            summary: "{{fields.catalogCode}} — {{fields.title}} ({{fields.status}})"
            fields:
              - { label: "ID Único", name: "id", widget: "string", default: "obra-nueva" }
              - { label: "Código de Catálogo", name: "catalogCode", widget: "string", default: "RON-125" }
              - { label: "Imagen de la Obra", name: "url", widget: "image" }
              - { label: "Título", name: "title", widget: "string" }
              - { label: "Artista", name: "artist", widget: "string", default: "Miguel Rondot" }
              - { label: "Año", name: "year", widget: "string", default: "2026" }
              - { label: "Técnica y Soporte", name: "technique", widget: "string", default: "Óleo sobre lienzo" }
              - { label: "Dimensiones (ej. 120 × 90 cm)", name: "dimensions", widget: "string" }
              - label: "Disponibilidad Comercial"
                name: "status"
                widget: "select"
                options:
                  - { label: "Disponible para adquisición", value: "disponible" }
                  - { label: "Reservado", value: "reservado" }
                  - { label: "En colección privada", value: "coleccion_privada" }
                default: "disponible"
              - { label: "Precio / Valor", name: "price", widget: "string", default: "Consultar" }
              - label: "Vibes (Atmósfera)"
                name: "vibes"
                widget: "list"
                default: ["Calma", "Naturaleza"]
              - label: "Tags Invisibles (Buscador)"
                name: "tags"
                widget: "list"
                default: ["oleo", "original"]
              - { label: "Nota Curatorial / Historia", name: "story", widget: "text" }
              - { label: "Ancho original (px)", name: "width", widget: "number", value_type: "int", default: 1000 }
              - { label: "Alto original (px)", name: "height", widget: "number", value_type: "int", default: 1000 }
